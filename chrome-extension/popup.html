<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JS Security Extractor</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-2: #f3f4f7;
      --text: #0b0b0d;
      --muted: #6b6f76;
      --line: #e2e5ea;
      --accent: #356AE6;
      --accent-hover: #2B5DCC;
      --accent-2: #111315;
      --success: #39c26b;
      --danger: #ff3b30;
      --shadow: 0 12px 30px rgba(0,0,0,0.12);
      --radius: 14px;
    }

    body {
      width: 420px;
      min-height: 320px;
      padding: 18px;
      font-family: "SF Pro Text", "SF Pro Display", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      background: linear-gradient(180deg, #ffffff 0%, #f5f6f8 100%);
      color: var(--text);
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    
    h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.3px;
      font-weight: 600;
    }
    
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: var(--panel-2);
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid var(--line);
    }

    .status-wrap {
      margin-bottom: 14px;
    }

    .diag-text {
      margin-top: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      word-break: break-word;
    }
    
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--muted);
    }
    
    .status-indicator.active {
      background: var(--success);
      box-shadow: 0 0 10px rgba(57, 194, 107, 0.6);
    }
    
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    
    .stat-box {
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset;
    }
    
    .stat-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--accent);
    }
    
    .stat-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
    }
    
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quick-setting {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 13px;
      color: var(--text);
    }

    .quick-setting input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      margin: 0;
    }

    .quick-setting-label {
      user-select: none;
      cursor: pointer;
    }
    
    button {
      padding: 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    button:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }
    
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    
    .btn-danger {
      background: var(--danger);
      color: white;
    }
    
    .btn-secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
    }
    
    .btn-light {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
    }
    
    .file-list {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-top: 14px;
      background: var(--panel);
    }
    
    .file-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }
    
    .file-item:last-child {
      border-bottom: none;
    }
    
    .file-url {
      color: var(--accent);
      word-break: break-all;
      text-decoration: none;
      display: block;
    }

    .file-url:hover {
      text-decoration: underline;
    }
    
    .file-meta {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }
    
    .empty-state {
      text-align: center;
      padding: 44px 20px;
      color: var(--muted);
    }
    
    .settings-icon {
      cursor: pointer;
      width: 22px;
      height: 22px;
      color: var(--text);
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>JS Security Extractor</h2>
    <svg class="settings-icon" id="settingsBtn" role="button" aria-label="Open Settings" viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M12 1v6m0 6v6m9-7h-6m-6 0H3m15.364 9.364l-4.243-4.243m0 0L9.88 14.88m8.486-8.486L14.12 10.64"></path>
    </svg>
  </div>
  
  <div class="status-wrap">
    <div class="status">
      <div class="status-indicator" id="statusIndicator"></div>
      <span id="statusText">Stopped</span>
    </div>
    <div class="diag-text" id="diagText">No files processed yet</div>
  </div>
  
  <div class="stats">
    <div class="stat-box">
      <div class="stat-value" id="fileCount">0</div>
      <div class="stat-label">Files Captured</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="queueCount">0</div>
      <div class="stat-label">In Queue</div>
    </div>
  </div>

  <div class="quick-setting">
    <input type="checkbox" id="performAnalysisOnUploadToggle">
    <label class="quick-setting-label" for="performAnalysisOnUploadToggle">Analyze On Upload</label>
  </div>
  
  <div class="controls">
    <button id="startBtn" class="btn-primary">Start Capture</button>
    <button id="stopBtn" class="btn-danger" style="display:none;">Stop Capture</button>
    <button id="exportBtn" class="btn-secondary">Export Files</button>
    <button id="clearBtn" class="btn-light">Clear All</button>
  </div>
  
  <div class="file-list" id="fileList">
    <div class="empty-state">No files captured yet</div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
