# Standalone AWS Access Key ID (AKIA…) rule.
#
# Kingfisher's built-in rule (kingfisher.aws.1) treats an access-key id as a
# pairing *identity*: under --no-validate it never emits a lone id — it only
# tallies it in the summary's findings_by_rule — so a leaked AKIA id in a
# target's JS was silently missed. This rule makes it a first-class finding.
#
# No min_entropy on purpose: the AKIA prefix + fixed 16-char [0-9A-Z] body + word
# boundaries are already near-zero-FP, and an entropy floor silently drops real
# but low-entropy ids (recon.findings.normalize's "a missing finding is not
# honest" bias). Kingfisher's built-in placeholder filter still suppresses the
# canonical AKIAIOSFODNN7EXAMPLE doc dummy. The provider slug is pinned to "aws"
# in recon.findings.normalize._PROVIDER_BY_RULE; the argv wiring is in
# recon.findings.kingfisher (_RULES_PATH / --rules-path).
rules:
  - name: AWS Access Key ID (standalone)
    id: custom.aws.akia_standalone
    pattern: |-
      \b(AKIA[0-9A-Z]{16})\b
    confidence: medium
    examples:
      - "AKIA2E4XZ7K9QW3RT8YV"
