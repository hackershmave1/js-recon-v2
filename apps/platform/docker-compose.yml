x-app-env: &app-env
  RECON_ENV: docker
  RECON_LOG_LEVEL: INFO
  # Inside the compose network, reach the stores by service name (not localhost).
  RECON_DATABASE_URL: postgresql+psycopg2://recon_app:recon_app@postgres:5432/recon
  RECON_DATABASE_ADMIN_URL: postgresql+psycopg2://recon:recon@postgres:5432/recon
  RECON_REDIS_URL: redis://redis:6379/0
  RECON_S3_ENDPOINT_URL: http://minio:9000
  RECON_S3_ACCESS_KEY: recon
  RECON_S3_SECRET_KEY: recon-secret
  RECON_S3_BUCKET: recon-artifacts
  RECON_SPA_DIST_DIR: /app/web/dist
  # Local-dev central-login signing key — a committed dev default like the DB/MinIO creds
  # above (a real deployment MUST override it via a secret store). Non-empty => login is
  # REQUIRED and the tenant comes from the signed session token; empty would disable auth
  # and brick the served SPA (login 503s), so it ships enabled.
  RECON_AUTH_SECRET: dev-only-auth-secret-change-in-prod

x-app-base: &app-base
  build:
    context: .
  image: recon-platform:local
  environment: *app-env

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon
      POSTGRES_DB: recon
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: recon
      MINIO_ROOT_PASSWORD: recon-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - miniodata:/data

  # Static fixture site for the discovery-crawl integration test (task 10). Sits on
  # the compose network's private IP so it is reachable in-scope by the worker;
  # egress re-validation still rejects it as an out-of-band manifest URL, which is
  # exactly why the real-katana test asserts at the harness/parse layer instead of
  # via discover_run (see crawl_integration_test.py).
  fixture-site:
    image: nginx:alpine
    volumes:
      - ./web/fixtures:/usr/share/nginx/html:ro
    networks:
      default:
        aliases:
          - recon.test

  # One-shot: apply migrations (schema + RLS + app role), then exit.
  migrate:
    <<: *app-base
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-base
    # D37-L0: coarse box-protection backstop (a cgroup RSS cap on THIS container). The
    # tight per-child bound is sourcemapper's RLIMIT_AS (config.sourcemapper_memory_limit_bytes);
    # this only guarantees a runaway can't exhaust the host — the OOM-killer never reaps
    # across the cap. Sized above the API's peak: it forks source-map recovery on a viewer/
    # reveal click (a whole-map load until D37-L2 streams it), so it needs recovery headroom.
    mem_limit: 4g
    command: ["uvicorn", "recon.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"
      interval: 5s
      timeout: 4s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app-base
    # D37-L0 box-protection backstop (see api). Higher than the API because the worker
    # also runs headless chromium (opt-in katana crawl / CDP capture) alongside analyze
    # and the sourcemapper recovery child, so the cap must sit well above their combined
    # peak — a limit that clipped a real crawl/capture would itself be the outage. Tune
    # per deployment against an observed chromium-heavy peak.
    mem_limit: 8g
    command: ["python", "-m", "recon.worker.main"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  miniodata:
