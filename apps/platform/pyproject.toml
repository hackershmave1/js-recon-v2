[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-platform"
version = "0.1.0"
description = "AppSec JavaScript API-recon platform — async recon pipeline (slice 1: async spine)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Required by FastAPI/Starlette to parse multipart/form-data (the JS upload path).
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "boto3>=1.34",
    # In-process JS static analysis ("Vespasian") — AST parsing of target bundles.
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    # Pure-Python JS beautifier for the no-map deobfuscator baseline (recon.findings.deobfuscate):
    # reformats a minified bundle with no source map so endpoint findings get distinct line numbers.
    "jsbeautifier>=1.15",
    # Out-of-process secret scanner (MongoDB Kingfisher). The wheel bundles the
    # platform binary and exposes a `kingfisher` console script; pinned so the
    # rule-id -> provider map (recon.findings.normalize) stays stable.
    "kingfisher-bin==1.106.0",
    # HTTP client for the fetch stage (pulling target assets through the egress guard).
    "httpx>=0.27",
    # Sync CDP (Chrome DevTools Protocol) client for the runtime-capture stage: the
    # worker drives the baked-in headless Chromium over websockets.sync.client, which
    # matches the blocking single-thread worker (no asyncio bridge). Already resolved
    # transitively via uvicorn; pinned explicit so the capture driver's import is a
    # declared dependency, not a transitive accident.
    "websockets>=13",
    # OpenAPI 3.x / Swagger 2.0 schema validation for the untrusted spec-ingest
    # path (recon.spec.ingest, gate B4). Ceiling-pinned: pre-1.0 software whose
    # `validate()` entrypoint and exception surface we've verified at 0.9 — a
    # minor bump could silently change the hardening guards' behavior.
    "openapi-spec-validator>=0.9,<0.10",
    # YAML parsing for the same hardened spec-ingest loader, which subclasses
    # `SafeLoader`/`Composer.compose_node` directly to reject anchors/aliases —
    # a direct `import yaml`, not just a transitive pull via the validator.
    "pyyaml>=6.0",
    # GraphQL document parsing (enrichment C, export-only): parse GraphQL operation
    # documents embedded in a bundle (gql`...`, graphql(`...`), {query:`...`}) so the
    # OpenAPI export can annotate them. Parsing only — no network, no schema
    # (precedent: openapi-spec-validator). Ceiling-pinned below the next major since
    # the parse()/GraphQLSyntaxError/AST-node surface we use is the stable 3.x API.
    "graphql-core>=3.2,<4",
    # Password hashing for the central login (recon.auth.passwords). bcrypt is the
    # only credential primitive we hand to a vetted library rather than hand-rolling;
    # the self-describing hash string is the whole stored credential (no salt column).
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "fakeredis>=2.21",
    "ruff>=0.16,<0.17",
    # DEBT D3: static type checking, strict on recon.findings + recon.spec first
    # (see [tool.mypy]). No stub packages needed — untyped 3rd-party deps (redis,
    # boto3, tree_sitter, yaml) resolve to Any via ignore_missing_imports.
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The standalone-AKIA Kingfisher rule (recon.findings.rules) is loaded at runtime
# via --rules-path. setuptools ships only *.py by default, so without this the
# wheel omits the rule file and every secret scan fails on a missing --rules-path.
"recon.findings" = ["rules/*.yml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src"]
python_files = ["*_test.py"]
addopts = "-ra -q"
markers = [
    "integration: requires a live Postgres/Redis (spin docker-compose first)",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# Real-bug + import-sort (F, I) plus the pyupgrade / bugbear / comprehension /
# simplify / flake8-pie / return families. TC (typing-only-import relocation) is
# deliberately deferred — 39 stylistic findings that fight `from __future__ import
# annotations` for ~nil runtime benefit (tracked follow-up). E501/formatting is
# `ruff format`'s job (enforced by `ruff format --check` in CI), not the linter's.
select = ["F", "I", "UP", "B", "C4", "SIM", "PIE", "RET"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers legitimately live in argument defaults
# (Depends(), File(), Query(), ...); B008 (function-call-in-default) must treat them
# as immutable rather than flag them — they are the framework's intended idiom.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Form",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Security",
]

[tool.mypy]
# DEBT D3: mypy is introduced INCREMENTALLY. Only recon.findings + recon.spec are
# type-checked strictly (the per-module override below); every other module is
# followed *silently* so intra-repo imports resolve without dragging out-of-scope
# errors (e.g. db/models.py's 194) into this gate. Widen module-by-module later.
# Relative paths resolve against the CWD, which is apps/platform for both the dev
# command and CI's host-tests lane.
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "silent"
exclude = ['_test\.py$']
warn_unused_configs = true

[[tool.mypy.overrides]]
# The two packages hardened first. `strict = true` is the honest, complete --strict
# bundle (per-module `strict` is accepted by the pinned mypy); mypy is lock-pinned,
# so the bundle can only expand at a deliberate `uv lock`.
module = ["recon.findings.*", "recon.spec.*"]
strict = true
