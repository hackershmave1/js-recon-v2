[project]
name = "js-security-extractor-api"
version = "3.0.0"
description = "Backend processing API for JavaScript security reviews"
requires-python = ">=3.11"

dependencies = [
  "fastapi==0.104.1",
  "uvicorn[standard]==0.24.0",
  "sqlalchemy==2.0.23",
  "psycopg2-binary==2.9.9",
  "pydantic==2.5.0",
  "pydantic-settings==2.1.0",
  "python-multipart==0.0.6",
  "aiofiles==23.2.1",
  "httpx==0.25.2",
  "alembic==1.13.0",
  "pytest==7.4.3",
  "jinja2==3.1.2",
  "pytest-cov>=7.0.0",
  "pytest-asyncio>=0.23.8",
]

[tool.uv]
package = false
