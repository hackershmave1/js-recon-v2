name: security

# Supply-chain scanning for a security tool (DEBT D6). Advisory on this Free-tier
# private repo (no branch protection), but a red job is still a visible signal, and
# the weekly schedule surfaces newly-disclosed CVEs in pinned deps WITHOUT a push.
# CodeQL is intentionally omitted: it needs GitHub Advanced Security, unavailable on
# a private Free-tier repo (the same tier limit that blocks branch protection).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC — catch new CVEs in pinned deps
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Scan the current WORKING TREE (`gitleaks dir`), not git history: this repo is
      # a secret-detection tool, so its history holds hundreds of intentional
      # fake-secret fixtures (incl. a deleted v1 rule corpus) that would make a
      # history gate pure noise. The gate's job is "don't SHIP a real secret", for
      # which the tree is the right surface. See .gitleaks.toml.
      - name: gitleaks (pinned CLI — no license needed for a personal private repo)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner .

  python-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.11
      - run: uv run --with pip-audit pip-audit

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: web
        working-directory: apps/platform/web
        run: |
          npm ci
          # npm is retiring the legacy /audits/quick endpoint and it intermittently returns HTTP
          # 400 ("audit endpoint returned an error"), which was failing this advisory job (DEBT D6)
          # for reasons unrelated to the dependency tree. Tolerate a transient endpoint/registry
          # error, but STILL fail on a real high/critical advisory so the check can't go blind.
          if npm audit --audit-level=high 2> audit.err; then
            echo "npm audit clean"
          elif grep -qiE 'audit endpoint returned an error|Bad Request|ENETUNREACH|ECONNRESET|EAI_AGAIN|ETIMEDOUT|socket hang up|network' audit.err; then
            echo "::warning::npm audit endpoint/registry error tolerated (npm retiring /audits/quick)"; cat audit.err >&2
          else
            cat audit.err >&2; exit 1
          fi
      - name: chrome-extension
        working-directory: apps/capture/chrome-extension
        run: |
          npm ci
          # npm is retiring the legacy /audits/quick endpoint and it intermittently returns HTTP
          # 400 ("audit endpoint returned an error"), which was failing this advisory job (DEBT D6)
          # for reasons unrelated to the dependency tree. Tolerate a transient endpoint/registry
          # error, but STILL fail on a real high/critical advisory so the check can't go blind.
          if npm audit --audit-level=high 2> audit.err; then
            echo "npm audit clean"
          elif grep -qiE 'audit endpoint returned an error|Bad Request|ENETUNREACH|ECONNRESET|EAI_AGAIN|ETIMEDOUT|socket hang up|network' audit.err; then
            echo "::warning::npm audit endpoint/registry error tolerated (npm retiring /audits/quick)"; cat audit.err >&2
          else
            cat audit.err >&2; exit 1
          fi
