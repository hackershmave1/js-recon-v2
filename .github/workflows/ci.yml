name: CI

# REQ-T4: the external-engine contract tests only guard against upstream
# output-schema drift if they actually run somewhere on every change. This
# workflow is that "somewhere". RECON_REQUIRE_ENGINES=1 turns a missing/broken
# engine from a silent skip into a hard failure, so a green build genuinely means
# "the pinned engines still produce the output our parsers expect".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast lane: everything that needs no Postgres/Redis/MinIO. Kingfisher ships as
  # a pip wheel (binary bundled), so its real-binary contract test runs here and
  # catches secret-output drift on every push. Vespasian (tree-sitter) is pure
  # Python and its extraction tests run here too.
  host-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Reproducible install from the committed lockfile (--frozen fails if
      # uv.lock has drifted from pyproject), so a transitive bump can't silently
      # flip CI red/green with no code change.
      - name: Install (locked + dev extras + the Kingfisher wheel)
        run: uv sync --frozen --extra dev --python 3.11
      - name: Lint (ruff check) + format check
        run: |
          uv run ruff check src
          uv run ruff format --check src
      # DEBT D3: static type checking, strict on recon.findings + recon.spec only
      # (per-module override in [tool.mypy]). Hermetic — no infra/engines/network —
      # so it belongs in the fast host lane. Widen module-by-module as more packages
      # are annotated. The `unused section` guard fails loudly if a future rename ever
      # stops the override matching those packages — otherwise mypy would silently run
      # NON-strict and still pass (a false-green gate). mypy errors fail via pipefail.
      - name: Type check (mypy — strict on findings + spec)
        run: |
          uv run mypy src/recon/findings src/recon/spec 2>&1 | tee mypy.out
          if grep -q 'unused section' mypy.out; then
            echo '::error::mypy strict override no longer matches recon.findings/recon.spec — gate would run non-strict'
            exit 1
          fi
      - name: Unit + engine contract tests (no infra) + coverage floor
        env:
          RECON_REQUIRE_ENGINES: "1"
        run: uv run pytest -m "not integration" --cov=recon --cov-fail-under=60
      # T10 (NOTICE): the enthec/webappanalyzer fingerprint dataset is GPL-3.0
      # and only safe to vendor because it's server-side only. This step is the
      # enforcement mechanism the NOTICE promises — it must fail loudly if the
      # dataset ever leaks into the distributed extension.
      - name: Guard — enthec dataset stays server-side (GPL-3.0, T10)
        working-directory: ${{ github.workspace }}
        run: |
          # Fail CLOSED: if apps/capture is missing, grep exits 2 (not 0/1) and a
          # bare `if grep ...; then` falls through to the "ok" branch below —
          # silently passing a guard that never actually looked anywhere. Assert
          # the directory exists first so that failure mode is a hard error instead.
          test -d apps/capture || { echo "::error::apps/capture missing — GPL server-side guard cannot verify boundary"; exit 1; }
          if grep -rInq "techdetect_data" apps/capture; then
            echo "::error::apps/capture references techdetect_data — the GPL-3.0 enthec dataset must stay server-side (see NOTICE)"
            grep -rIn "techdetect_data" apps/capture
            exit 1
          fi
          echo "ok: apps/capture does not reference techdetect_data"

  # Front-end lane: lints, tests, and builds the SPA on its own (no Python/Docker
  # needed), so a broken web build fails fast instead of only surfacing during the
  # Docker image build in integration-tests.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/platform/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Capture-extension lane (DEBT D16): the MV3 extension under apps/capture ships
  # Node test suites (tests/test_*.mjs) that no lane ran — security.yml only
  # `npm audit`s this package — so a logic regression in the runtime-capture client
  # could land on main green. The suites import only node: builtins + local modules
  # (no third-party node_modules), so no `npm ci`/build is needed to run them; a
  # future suite that adds a dependency import will fail loudly here (add `npm ci` then).
  extension:
    runs-on: ubuntu-latest
    # The suites finish in seconds; cap the job so a hung/leaked-handle suite fails
    # fast instead of riding the 6h default (CI minutes matter on a Free-tier repo).
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/capture/chrome-extension
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Fail CLOSED: an empty glob (suites moved/renamed) is a hard error, not a
      # silent pass — a gate that runs zero tests is a false green. Run every suite
      # so one failure doesn't mask the rest, then exit non-zero if any failed.
      - name: Run MV3 capture-extension test suites
        run: |
          shopt -s nullglob
          suites=(tests/test_*.mjs)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::no extension test suites found (tests/test_*.mjs) — refusing to pass a zero-test gate"
            exit 1
          fi
          echo "running ${#suites[@]} suite(s)"
          rc=0
          for t in "${suites[@]}"; do
            echo "::group::$t"
            node "$t" || rc=1
            echo "::endgroup::"
          done
          exit $rc

  # Full lane: builds the app image (which compiles the pinned Sourcemapper commit
  # with Go) and brings up the data stores, then runs the whole suite inside the
  # image. This is where Sourcemapper's real-binary golden-map contract test and
  # the end-to-end integration tests run.
  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v6
      - name: Build image + start stores + fixture-site + migrate
        # fixture-site (nginx, aliased recon.test on the compose network) serves the
        # crawl-target fixtures the real-katana integration tests hit; without it those
        # crawls resolve nothing and assert []. It shares the network the `docker compose
        # run api` one-off joins, so the alias resolves. nginx is up in <1s vs a 30s crawl.
        run: docker compose up -d --build postgres redis minio migrate fixture-site
      - name: Full suite incl. real-engine contract tests + integration
        # Auth OFF for the suite (RECON_AUTH_SECRET=""): the header-based integration tests use
        # X-Tenant-Id, but the tracked compose now sets RECON_AUTH_SECRET so a real `docker
        # compose up` is login-gated (else the served SPA bricks). The auth-specific tests
        # re-enable auth per-test via monkeypatch, so the login path is still exercised here.
        run: >
          docker compose run --rm --user root -e RECON_REQUIRE_ENGINES=1 -e RECON_AUTH_SECRET=""
          api sh -c "pip install --quiet pytest fakeredis && pytest -m ''"
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
